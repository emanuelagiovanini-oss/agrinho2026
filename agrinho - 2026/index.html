<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Pegada Ambiental - Agrinho</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #81c784;
            --background-color: #f1f8e9;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .question-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        select {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--secondary-color);
            border-radius: 8px;
            background-color: white;
            font-size: 16px;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 25px;
        }

        button:hover {
            background-color: #1b5e20;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background-color: #e8f5e9;
            border-left: 5px solid var(--primary-color);
            display: none;
        }

        #result h2 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 10px;
        }

        .low { background-color: #c8e6c9; color: #256029; }
        .medium { background-color: #ffe082; color: #c57b00; }
        .high { background-color: #ffcdd2; color: #c62828; }
    </style>
</head>
<body>

<div class="container">
    <h1>Simulador de Pegada Ambiental</h1>
    <p class="subtitle">Projeto Agrinho: Sustentabilidade no Dia a Dia</p>

    <div class="question-group">
        <label for="alimentacao">1. Como é a sua base de alimentação?</label>
        <select id="alimentacao">
            <option value="1">Consumo muita carne vermelha diariamente</option>
            <option value="2">Consumo carnes (frango/peixe) e vegetais de forma equilibrada</option>
            <option value="3">Vegetariano / Vegano (foco em plantas e grãos)</option>
        </select>
    </div>

    <div class="question-group">
        <label for="transporte">2. Qual o seu principal meio de transporte?</label>
        <select id="transporte">
            <option value="1">Carro particular (sozinho)</option>
            <option value="2">Transporte público (ônibus/trem) ou carona</option>
            <option value="3">A pé, de bicicleta ou veículo elétrico</option>
        </select>
    </div>

    <div class="question-group">
        <label for="residuos">3. Como você lida com o lixo na sua casa?</label>
        <select id="residuos">
            <option value="1">Não separo nada, vai tudo para o mesmo lixo</option>
            <option value="2">Separo apenas os recicláveis (plástico, papel, metal)</option>
            <option value="3">Separo recicláveis e faço compostagem do lixo orgânico</option>
        </select>
    </div>

    <div class="question-group">
        <label for="consumo">4. Qual o seu hábito de consumo de água e energia?</label>
        <select id="consumo">
            <option value="1">Demoro nos banhos e deixo luzes e eletrônicos ligados à toa</option>
            <option value="2">Tento economizar, mas às vezes esqueço</option>
            <option value="3">Banhos rápidos, captação de água da chuva e lâmpadas LED</option>
        </select>
    </div>

    <button onclick="calcularPegada()">Calcular Pegada Ambiental</button>

    <div id="result">
        <h2>Seu Resultado</h2>
        <p id="feedback-text"></p>
        <div id="nivel-badge" class="badge"></div>
    </div>
</div>

<script>
    function calcularPegada() {
        // Pega os valores selecionados (convertendo para números)
        const q1 = parseInt(document.getElementById('alimentacao').value);
        const q2 = parseInt(document.getElementById('transporte').value);
        const q3 = parseInt(document.getElementById('residuos').value);
        const q4 = parseInt(document.getElementById('consumo').value);

        // Soma dos pontos (Opção 1 = pior [mais pegada], Opção 3 = melhor [menos pegada])
        // Total máximo = 12 (sustentável), Total mínimo = 4 (alto impacto)
        const totalPontos = q1 + q2 + q3 + q4;
        
        const resultDiv = document.getElementById('result');
        const feedbackText = document.getElementById('feedback-text');
        const badge = document.getElementById('nivel-badge');

        resultDiv.style.display = 'block';

        if (totalPontos <= 6) {
            badge.textContent = "Pegada Ecológica: ALTA";
            badge.className = "badge high";
            feedbackText.textContent = "Seus hábitos diários geram um alto impacto ambiental. Para ajudar o planeta e apoiar as ideias do Agrinho, tente reduzir o consumo de carne, economizar energia e optar por transportes mais limpos sempre que possível!";
        } else if (totalPontos <= 9) {
            badge.textContent = "Pegada Ecológica: MODERADA";
            badge.className = "badge medium";
            feedbackText.textContent = "Você já tem consciência ambiental e pratica boas ações, mas ainda há espaço para melhorar! Pequenas mudanças na separação do lixo ou na economia de água podem fazer uma grande diferença.";
        } else {
            badge.textContent = "Pegada Ecológica: BAIXA (Sustentável)";
            badge.className = "badge low";
            feedbackText.textContent = "Parabéns! Seus hábitos estão super alinhados com os objetivos de sustentabilidade do Agrinho. Você protege os recursos naturais e serve de exemplo para a sua comunidade escolar e familiar.";
        }

        // Rola a página suavemente para o resultado
        resultDiv.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
